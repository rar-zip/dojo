name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 跑测试
        run: python3 -W error tests/test_core.py
      - name: 安装器是否跟源码同步
        run: |
          python3 tools/build_installer.py
          git diff --exit-code -- dist/dojo-install.sh
